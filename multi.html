<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Marks Prediction System</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }
        
        .main-box {
            background: white;
            margin-top: 60px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.2);
        }
        
        h1 {
            text-align: center;
            color: #007BFF;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        label {
            font-weight: bold;
            color: #333;
        }
        
        .form-control {
            border-radius: 10px;
            height: 45px;
        }
        
        .btn-custom {
            width: 100%;
            background: #007BFF;
            color: white;
            font-size: 20px;
            border-radius: 10px;
            padding: 10px;
            border: none;
        }
        
        .btn-custom:hover {
            background: #0056b3;
        }
        
        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background: #f2f9ff;
            text-align: center;
        }
        
        .result-box h2 {
            color: green;
            font-weight: bold;
        }
        
        .result-box h3 {
            color: #ff6600;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="main-box">

                    <h1>🎓 Student Marks Prediction</h1>

                    <form action="/predict" method="POST">

                        <div class="form-group">

                            <label>📚 Study Hours</label>

                            <input type="number" step="any" class="form-control" name="hours" placeholder="Enter Study Hours" required>

                        </div>

                        <div class="form-group">

                            <label>😴 Sleep Hours</label>

                            <input type="number" step="any" class="form-control" name="sleep" placeholder="Enter Sleep Hours" required>

                        </div>

                        <div class="form-group">

                            <label>📅 Attendance Percentage</label>

                            <input type="number" step="any" class="form-control" name="attendance" placeholder="Enter Attendance %" required>

                        </div>

                        <button type="submit" class="btn-custom">

                            Predict Marks

                        </button>

                    </form>

                    {% if prediction %}

                    <div class="result-box">

                        <h2>

                            Predicted Marks : {{ prediction }}

                        </h2>

                        <h3>

                            {{ result }}

                        </h3>

                    </div>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</body>

</html>
